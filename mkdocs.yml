site_name: 明理斋 · 易学与命理笔记
site_description: 易经、风水、四柱八字、奇门遁甲、面相学的学习笔记与命例整理
site_author: 明理斋
site_url: https://example.com

theme:
  name: materialx
  language: zh
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.tracking
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: 切换到深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: 切换到浅色模式

plugins:
  - materialx/search
  - materialx/blog:
      blog_dir: blog
      post_dir: blog/posts
      post_url_format: "{date}/{slug}"
      categories: true
      archive: true
      pagination_per_page: 10
      post_readtime: true
  - materialx/tags

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
  - 首页: index.md
  - 易经:
      - 总览: yijing/index.md
      - 基础概念: yijing/basics.md
      - 六十四卦: yijing/hexagrams.md
  - 风水:
      - 总览: fengshui/index.md
      - 天星风水: fengshui/tianxing/index.md
      - 八卦风水: fengshui/bagua/index.md
      - 一宅断: fengshui/yizhaiduan/index.md
      - 三元风水: fengshui/sanyuan/index.md
      - 玄空大卦: fengshui/xuankong/index.md
  - 四柱八字:
      - 总览: bazi/index.md
      - 干支基础: bazi/stems-branches.md
  - 奇门遁甲:
      - 总览: qimen/index.md
  - 面相学:
      - 总览: mianxiang/index.md
  - 命例库: cases/index.md
  - 学习笔记: notes/index.md
  - 博客: blog/index.md
  - 标签: tags.md
  - 关于本站: about/index.md
